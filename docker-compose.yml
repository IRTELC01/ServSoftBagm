services:
  db:
    image: postgres:16
    container_name: servsoftbagm-db-1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: servsoftbagm
    ports:
      - "5432:5432"
    volumes:
      - servsoftbagm_pgdata:/var/lib/postgresql/data

volumes:
  servsoftbagm_pgdata:
