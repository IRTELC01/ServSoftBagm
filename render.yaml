services:
  - type: web
    name: servsoftbagm-api
    env: node
    repo: https://github.com/IRTELC01/ServSoftBagm.git
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    plan: free
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        value: servsoft123
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    runtime: static
    name: servsoftbagm-web
    repo: https://github.com/IRTELC01/ServSoftBagm.git
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://${servsoftbagm-api.publicHost}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
