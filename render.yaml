# =====================================================
# ServSoftBagm - Render Blueprint Configuration
# =====================================================
#
# ORDEN OBLIGATORIO DE DESPLIEGUE:
# 1. Despliega primero el servicio "servsoftbagm-api" (backend)
# 2. Espera a que esté "Live"
# 3. Copia la URL del API (ej: https://servsoftbagm-api-xxxx.onrender.com)
# 4. Actualiza VITE_API_URL en el servicio estático
# 5. Redeploya el frontend
#
# NOTA: el backend usa Postgres (Neon) en producción vía DB_DRIVER=pg +
# DATABASE_URL. NO usar SQLite en Render: el disco es efímero y los datos
# se pierden en cada deploy/restart.
# =====================================================

services:
  # ============================================
  # BACKEND API - Node.js + Express + Postgres (Neon)
  # ============================================
  - type: web
    name: servsoftbagm-api
    env: node
    rootDir: apps/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    plan: free
    autoDeploy: true
    envVars:
      - key: DB_DRIVER
        value: pg
      - key: DATABASE_URL
        sync: false
        # Pega aquí la connection string de Neon (formato postgresql://...)
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
        # OBLIGATORIO: define manualmente una contraseña fuerte antes del deploy.
        # NUNCA dejar el valor por defecto servsoft123 en producción.
      - key: MASTER_ENABLE
        value: "false"
      - key: OPEN_ACCESS
        value: "false"
        # true = acceso público sin login (solo demo)
        # false = obliga login (obligatorio en producción)
      - key: FRONTEND_ORIGIN
        value: https://servsoftbagm-web.onrender.com

  # ============================================
  # FRONTEND - React + Vite + Tailwind (Static Site)
  # ============================================
  - type: web
    runtime: static
    name: servsoftbagm-web
    rootDir: apps/client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # =====================================================
      # ⚠️  VARIABLE CRÍTICA - DEBES ACTUALIZARLA MANUALMENTE
      # =====================================================
      # 1. Espera a que el servicio "servsoftbagm-api" esté Live
      # 2. Copia su URL (sin /api al final)
      # 3. Pega aquí: https://TU-API.onrender.com/api
      #
      # Ejemplo correcto:
      # https://servsoftbagm-api-abc123.onrender.com/api
      - key: VITE_API_URL
        value: https://servsoftbagm-api.onrender.com/api

      # false = obliga login (obligatorio en producción)
      - key: VITE_OPEN_ACCESS
        value: "false"

      # QR Bancario — imagen alojada externamente.
      # QRBanco.jpeg está gitignoreado y NO existe en el build de Render.
      # Sube la imagen a un servicio (imgur, CDN, etc.) y pega la URL aquí.
      # Si se omite, el Dashboard muestra fallback con instrucciones.
      # - key: VITE_BANK_QR_URL
      #   value: https://i.imgur.com/tuQRBanco.jpeg

      # Datos bancarios (texto, NO imagen) — también sensibles, configurar manualmente.
      # - key: VITE_BANK_NAME
      #   value: TuBanco
      # - key: VITE_BANK_ACCOUNT_TYPE
      #   value: Ahorros
      # - key: VITE_BANK_ACCOUNT_NUMBER
      #   value: 000-000000-00
      # - key: VITE_BANK_HOLDER_NAME
      #   value: Nombre Apellido
      # - key: VITE_BANK_HOLDER_ID
      #   value: 00000000
      # - key: VITE_BANK_INSTRUCTIONS
      #   value: Realiza la transferencia y envía el comprobante por WhatsApp.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
